<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="390" viewBox="0 0 1280 390" role="img" aria-labelledby="title desc">
<title id="title">AgentGlass — see the shape of every agent run</title><desc id="desc">Animated dark observability motif with connected event nodes, a timeline waveform, and cyan-violet accents.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07111e"/><stop offset=".55" stop-color="#0d1427"/><stop offset="1" stop-color="#16112b"/></linearGradient><linearGradient id="word"><stop offset="0" stop-color="#f4fbff"/><stop offset=".58" stop-color="#70eaff"/><stop offset="1" stop-color="#bca6ff"/></linearGradient><radialGradient id="halo"><stop offset="0" stop-color="#3bdff0" stop-opacity=".22"/><stop offset="1" stop-color="#3bdff0" stop-opacity="0"/></radialGradient><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#a7c2e8" stroke-opacity=".07"/></pattern><filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter><clipPath id="clip"><rect width="1280" height="390" rx="24"/></clipPath></defs>
<g clip-path="url(#clip)"><rect width="1280" height="390" rx="24" fill="url(#bg)"/><rect width="1280" height="390" fill="url(#grid)"/><circle cx="1050" cy="174" r="290" fill="url(#halo)"/><path d="M0 300 C180 248 300 342 492 280 S800 230 970 272 S1140 320 1280 238" fill="none" stroke="#62deff" stroke-opacity=".09"/><path d="M0 320 C180 268 300 362 492 300 S800 250 970 292 S1140 340 1280 258" fill="none" stroke="#a58bff" stroke-opacity=".09"/>
<g transform="translate(72 64)"><rect width="52" height="52" rx="16" fill="#102b3a" stroke="#55e7ec" stroke-opacity=".7"/><path d="M14 27h9l6-12 7 23 7-13h-5" fill="none" stroke="#76f4e2" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="43" cy="10" r="3" fill="#a6a0ff"><animate attributeName="opacity" values=".35;1;.35" dur="2.4s" repeatCount="indefinite"/></circle></g>
<text x="142" y="98" fill="#dce9fa" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" letter-spacing="4" font-weight="600">LOCAL-FIRST AGENT OBSERVABILITY</text><text x="70" y="178" fill="url(#word)" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="67" font-weight="800" letter-spacing="-2.5">AgentGlass</text><text x="74" y="220" fill="#bdcbe2" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="23">Make every run inspectable.</text><text x="74" y="258" fill="#8195b2" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15">Trace events · Tool calls · Failure context · Local JSONL</text>
<g transform="translate(74 292)"><rect width="148" height="31" rx="15.5" fill="#113c3a" stroke="#3de2c0" stroke-opacity=".65"/><circle cx="16" cy="15.5" r="4" fill="#57f2d0"/><text x="29" y="20" fill="#bcfff1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="700">PYTHON SDK</text><rect x="160" width="139" height="31" rx="15.5" fill="#1b2141" stroke="#9d95ff" stroke-opacity=".65"/><text x="179" y="20" fill="#d4d0ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="700">ZERO RUNTIME DEPS</text></g>
<g transform="translate(700 76)"><rect width="510" height="244" rx="19" fill="#091221" stroke="#526783" stroke-opacity=".62"/><rect x="1" y="1" width="508" height="43" rx="18" fill="#111c30"/><path d="M1 43H509" stroke="#3b4e6b" stroke-opacity=".6"/><circle cx="22" cy="22" r="4" fill="#ff7d92"/><circle cx="38" cy="22" r="4" fill="#ffc86b"/><circle cx="54" cy="22" r="4" fill="#58e7c5"/><text x="78" y="27" fill="#a7bbd4" font-family="ui-monospace,Consolas,monospace" font-size="12">TRACE / RUN_7F2A</text>
<rect x="24" y="64" width="462" height="45" rx="9" fill="#101f31" stroke="#36516a" stroke-opacity=".65"/><circle cx="44" cy="86" r="5" fill="#65e8cb" filter="url(#glow)"/><text x="60" y="82" fill="#e3f5fb" font-family="ui-monospace,Consolas,monospace" font-size="12">run.started</text><text x="60" y="97" fill="#7f9cb4" font-family="ui-monospace,Consolas,monospace" font-size="10">sequence 000 · local recorder</text>
<rect x="24" y="120" width="462" height="45" rx="9" fill="#111c34" stroke="#6c69aa" stroke-opacity=".7"/><circle cx="44" cy="142" r="5" fill="#a59aff" filter="url(#glow)"/><text x="60" y="138" fill="#e8e5ff" font-family="ui-monospace,Consolas,monospace" font-size="12">tool.completed</text><text x="60" y="153" fill="#9597c2" font-family="ui-monospace,Consolas,monospace" font-size="10">docs.search · measured duration · output redacted</text>
<rect x="24" y="176" width="462" height="45" rx="9" fill="#102a2b" stroke="#3de2c0" stroke-opacity=".6"/><circle cx="44" cy="198" r="5" fill="#5af0ca" filter="url(#glow)"/><text x="60" y="194" fill="#d6fff6" font-family="ui-monospace,Consolas,monospace" font-size="12">run.completed</text><text x="60" y="209" fill="#81c9bc" font-family="ui-monospace,Consolas,monospace" font-size="10">v1.0 event schema · JSONL export</text><path d="M11 86H24 M11 142H24 M11 198H24" stroke="#65dfff" stroke-width="1.5" stroke-dasharray="3 4"><animate attributeName="stroke-dashoffset" from="0" to="-14" dur="1.2s" repeatCount="indefinite"/></path></g>
<text x="1208" y="365" text-anchor="end" fill="#667d9a" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" letter-spacing="1.4">OBSERVABLE EVENTS. NOT HIDDEN REASONING.</text><rect x=".5" y=".5" width="1279" height="389" rx="23.5" fill="none" stroke="#5f7b9c" stroke-opacity=".32"/></g></svg>
