<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="650" viewBox="0 0 1280 650" role="img" aria-labelledby="title desc">
<title id="title">AgentGlass synthetic trace viewer concept</title>
<desc id="desc">A premium dark observability user-interface concept showing a synthetic run summary, event timeline, trace steps, timings and a tool result. It is illustrative and not a shipped web dashboard.</desc>
<defs>
