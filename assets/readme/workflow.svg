<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
<title id="title">AgentGlass trace workflow</title><desc id="desc">Four-step workflow: record, normalize, protect, inspect.</desc>
<defs><linearGradient id="wbg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#081321"/><stop offset="1" stop-color="#15132a"/></linearGradient><linearGradient id="route"><stop offset="0" stop-color="#55ebd0"/><stop offset=".55" stop-color="#62d9ff"/><stop offset="1" stop-color="#a797ff"/></linearGradient><filter id="softGlow"><feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
<rect width="1200" height="430" rx="20" fill="url(#wbg)"/><path d="M28 54H1172" stroke="#536783" stroke-opacity=".35"/><text x="44" y="37" fill="#dbe8f8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700">FROM RAW OBSERVATION TO A DEBUGGABLE TRACE</text><text x="1154" y="36" fill="#8098b8" text-anchor="end" font-family="ui-monospace,Consolas,monospace" font-size="12">LOCAL PIPELINE / V1.0</text>
<path d="M270 214H324 M570 214H624 M870 214H924" stroke="url(#route)" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="7 8"><animate attributeName="stroke-dashoffset" from="0" to="-30" dur="1.8s" repeatCount="indefinite"/></path>
<g font-family="Inter,Segoe UI,Arial,sans-serif">
<g transform="translate(40 102)"><rect width="230" height="226" rx="16" fill="#0e2031" stroke="#4c9fbe"/><rect x="18" y="18" width="38" height="28" rx="8" fill="#14394a"/><text x="37" y="37" text-anchor="middle" fill="#7ce9ff" font-size="12" font-weight="800">01</text><path d="M28 81h23l11-16 13 31 12-20h16" stroke="#62dfff" stroke-width="2.5" fill="none" stroke-linecap="round"/><text x="20" y="134" fill="#eff8ff" font-size="17" font-weight="700">Record</text><text x="20" y="158" fill="#9bb0c9" font-size="12">Run · span · tool call</text><text x="20" y="177" fill="#9bb0c9" font-size="12">Model request / response</text><rect x="20" y="192" width="190" height="22" rx="6" fill="#122f40"/><text x="30" y="207" fill="#7fdff7" font-size="10" font-family="ui-monospace,Consolas,monospace">agentglass.start_run()</text></g>
<g transform="translate(340 102)"><rect width="230" height="226" rx="16" fill="#122332" stroke="#46b9a6"/><rect x="18" y="18" width="38" height="28" rx="8" fill="#123b3b"/><text x="37" y="37" text-anchor="middle" fill="#65f1ce" font-size="12" font-weight="800">02</text><rect x="27" y="66" width="70" height="23" rx="5" fill="#153e3e" stroke="#43cfae"/><rect x="106" y="66" width="88" height="23" rx="5" fill="#123849" stroke="#4ac8e4"/><path d="M97 77h9" stroke="#80e6d4" stroke-width="2"/><text x="62" y="81" text-anchor="middle" fill="#baffef" font-size="9">EVENT</text><text x="150" y="81" text-anchor="middle" fill="#b6f0ff" font-size="9">SCHEMA</text><text x="20" y="134" fill="#effffb" font-size="17" font-weight="700">Normalize</text><text x="20" y="158" fill="#9ec9c4" font-size="12">Versioned, typed events</text><text x="20" y="177" fill="#9ec9c4" font-size="12">IDs · sequence · timestamps</text><rect x="20" y="192" width="190" height="22" rx="6" fill="#163a38"/><text x="30" y="207" fill="#89ead5" font-size="10" font-family="ui-monospace,Consolas,monospace">TraceEvent v1.0</text></g>
<g transform="translate(640 102)"><rect width="230" height="226" rx="16" fill="#201b38" stroke="#9287ee"/><rect x="18" y="18" width="38" height="28" rx="8" fill="#352b58"/><text x="37" y="37" text-anchor="middle" fill="#d4c8ff" font-size="12" font-weight="800">03</text><path d="M29 68h15v14h15v14h15 M78 68h18v28h18" stroke="#a99cff" stroke-width="2.5" fill="none" stroke-linecap="round"/><circle cx="45" cy="68" r="4" fill="#c6bbff" filter="url(#softGlow)"/><circle cx="74" cy="96" r="4" fill="#8dd9ff" filter="url(#softGlow)"/><text x="20" y="134" fill="#f5f0ff" font-size="17" font-weight="700">Protect</text><text x="20" y="158" fill="#b4a9d4" font-size="12">Recursive secret / PII masking</text><text x="20" y="177" fill="#b4a9d4" font-size="12">Size, depth, item bounds</text><rect x="20" y="192" width="190" height="22" rx="6" fill="#30284c"/><text x="30" y="207" fill="#c9bdff" font-size="10" font-family="ui-monospace,Consolas,monospace">redact before write</text></g>
<g transform="translate(940 102)"><rect width="220" height="226" rx="16" fill="#172a2e" stroke="#65d8b6"/><rect x="18" y="18" width="38" height="28" rx="8" fill="#19433b"/><text x="37" y="37" text-anchor="middle" fill="#8ff4ce" font-size="12" font-weight="800">04</text><path d="M28 66h48l12 12v22H28z" fill="#163d39" stroke="#57d5b3" stroke-width="1.6"/><path d="M76 66v12h12M38 85h37M38 93h29" stroke="#85f1d5" stroke-width="1.5" fill="none"/><text x="20" y="134" fill="#effff8" font-size="17" font-weight="700">Inspect</text><text x="20" y="158" fill="#a2d4c5" font-size="12">JSONL · summary · validation</text><text x="20" y="177" fill="#a2d4c5" font-size="12">Readable local event timeline</text><rect x="20" y="192" width="180" height="22" rx="6" fill="#1a4139"/><text x="30" y="207" fill="#95f0d2" font-size="10" font-family="ui-monospace,Consolas,monospace">agentglass inspect</text></g>
</g><text x="600" y="383" text-anchor="middle" fill="#849ab8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12">The recorder observes events provided by your application; it does not execute tools or reveal hidden model reasoning.</text><rect x=".5" y=".5" width="1199" height="429" rx="19.5" fill="none" stroke="#7893b1" stroke-opacity=".28"/>
</svg>
